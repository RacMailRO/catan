<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Sail Gradients -->
    <linearGradient id="sail_front_red" x1="50" y1="26" x2="88" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4444" />
      <stop offset="50%" stop-color="#EE0000" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
    <linearGradient id="sail_shadow_red" x1="40" y1="60" x2="60" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EE0000" />
      <stop offset="100%" stop-color="#550000" />
    </linearGradient>

    <!-- Wood Hull Gradients -->
    <linearGradient id="hull_main" x1="20" y1="80" x2="110" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9C5221" />
      <stop offset="40%" stop-color="#B86B33" />
      <stop offset="70%" stop-color="#8C4415" />
      <stop offset="100%" stop-color="#6E330D" />
    </linearGradient>
    <linearGradient id="hull_rim" x1="25" y1="80" x2="105" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#662E08" />
      <stop offset="100%" stop-color="#3D1802" />
    </linearGradient>
    <linearGradient id="wood_mast" x1="60" y1="12" x2="68" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C27A41" />
      <stop offset="50%" stop-color="#8C4415" />
      <stop offset="100%" stop-color="#4D2005" />
    </linearGradient>
  </defs>

  <!-- Heavy Outer Silhouette Shadow/Border (Consistent with Settlement & City art) -->
  <path d="M60 12 H68 V22 H96 C98 22 99 24 98 26 L94 40 C98 56 98 76 93 96 L104 102 C114 96 119 82 118 68 C117 62 112 56 107 58 C102 60 104 68 106 72 C108 78 105 88 97 94 L92 97 C80 106 60 110 40 108 L28 100 C20 94 16 80 18 66 C19 60 23 54 28 56 C33 58 31 66 29 70 C27 76 30 84 37 90 L42 93 L40 40 L34 26 C33 24 34 22 36 22 H60 Z"
        fill="none" stroke="#000" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Aft Stern Post (Left curly dragon/viking head) -->
  <!-- Outer black stroke -->
  <path d="M22 104 C13 94 10 76 13 60 C14 53 19 46 25 48 C31 50 30 59 27 65 C24 72 26 84 34 92 Z"
        fill="#000" />
  <!-- Wooden body -->
  <path d="M24 102 C16 93 13 77 16 62 C17 56 21 51 25 52 C28 53 28 60 25 65 C23 71 25 82 32 90 Z"
        fill="url(#hull_main)" />

  <!-- Forward Prow Post (Right curly dragon/caravel prow) -->
  <!-- Outer black stroke -->
  <path d="M96 106 C107 100 114 88 114 74 C114 66 109 59 103 61 C98 63 99 71 101 76 C104 83 100 92 92 98 Z"
        fill="#000" />
  <!-- Wooden body -->
  <path d="M97 104 C106 98 112 87 112 75 C112 68 108 63 104 64 C101 65 101 71 103 76 C105 82 101 90 94 96 Z"
        fill="url(#hull_main)" />

  <!-- Inside Deck / Hollow Cavity (Shadow depth) -->
  <path d="M28 98 C38 92 60 88 88 92 L96 99 C85 105 60 107 35 104 Z" fill="url(#hull_rim)" stroke="#000" stroke-width="3" />

  <!-- Central Mast & Top Spar (Behind the sail) -->
  <rect x="61.5" y="14" width="5" height="92" rx="1.5" fill="url(#wood_mast)" stroke="#000" stroke-width="2.5" />
  <!-- Yardarm (Horizontal Crossbeam) -->
  <path d="M34 23 L94 23 L93 28 L35 28 Z" fill="url(#wood_mast)" stroke="#000" stroke-width="3" stroke-linejoin="round" />
  <!-- Masthead Cap -->
  <rect x="60" y="10" width="8" height="6" rx="2" fill="#D98A48" stroke="#000" stroke-width="2.5" />

  <!-- Billowing Main Sail (The Player Color Piece!) -->
  <!-- Sail Drop Shadow / Underlay -->
  <path d="M36 27 C50 25 78 25 92 27 C98 50 97 74 91 95 C75 99 55 98 42 93 C37 72 35 48 36 27 Z"
        fill="#000" />

  <!-- Main Billowing Sail Body -->
  <path d="M38 28 C51 26 77 26 90 28 C95 49 95 72 89 93 C74 97 55 96 44 91 C39 71 37 48 38 28 Z"
        fill="url(#sail_front_red)" stroke="#550000" stroke-width="3" stroke-linejoin="round" />

  <!-- Sail Vertical Seam / Contour Curvature Lines (Gives real billowing volume) -->
  <path d="M54 27 C53 48 54 70 57 93" fill="none" stroke="#550000" stroke-width="2" opacity="0.45" />
  <path d="M72 27 C73 48 74 71 75 94" fill="none" stroke="#550000" stroke-width="2" opacity="0.45" />

  <!-- Sail Wind Highlight (Upper curve catching ambient light) -->
  <path d="M42 32 C55 30 73 30 84 32 C86 44 85 62 82 76 C70 70 54 70 45 74 C42 60 41 45 42 32 Z"
        fill="#FFF" opacity="0.18" />

  <!-- Main Wooden Hull Front Body (Overlaps lower sail edge in 3D isometric view) -->
  <!-- Outer Hull Wall -->
  <path d="M20 94 C35 110 75 118 106 102 L101 112 C72 124 33 118 16 101 Z"
        fill="#000" />
  <path d="M22 95 C36 108 73 116 104 102 L100 110 C72 121 34 115 18 101 Z"
        fill="url(#hull_main)" stroke="#000" stroke-width="3" stroke-linejoin="round" />

  <!-- Hull Plank Strake Line -->
  <path d="M22 99 C38 110 72 116 100 106" fill="none" stroke="#4A1E03" stroke-width="2.5" />

  <!-- Water Ripple / Plinth Base (Grounds the ship naturally on sea edges) -->
  <ellipse cx="62" cy="116" rx="42" ry="5.5" fill="#38BDF8" opacity="0.5" />
  <ellipse cx="62" cy="116" rx="34" ry="3" fill="#FFF" opacity="0.6" />
</svg>